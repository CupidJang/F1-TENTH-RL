env:
  action_type: continuous

agent:
  name: td3
  hidden_sizes: [256, 256]
  gamma: 0.998
  actor_lr: 0.0003
  critic_lr: 0.0003
  tau: 0.005
  batch_size: 256
  learning_starts: 5000
  train_freq: 1
  exploration_noise: 0.1
  policy_noise: 0.2
  noise_clip: 0.5
  policy_delay: 2
  buffer:
    capacity: 1000000
